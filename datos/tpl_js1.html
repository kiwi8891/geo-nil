<script>
"use strict";
var MAPA = /*__MAPA__*/;
var LIGA = /*__LIGA__*/;
var BANDERAS = /*__BANDERAS__*/;
var ATLAS = /*__ATLAS__*/;

/* ---------------- bloques ----------------
   Las capitales tienen bloque propio: mezcladas con las comunidades, Nil no sabía
   si le pedían el territorio o la chincheta. */
var BLOQUES = {
  ccaa:      {nm:"COMUNIDADES",     ic:"🗺️", c1:"#c74a3a", c2:"#8e2418"},
  capitales: {nm:"CAPITALES",       ic:"⭐",  c1:"#c9952f", c2:"#7d5410"},
  rios:      {nm:"RÍOS",            ic:"💧", c1:"#2f7fc4", c2:"#17466f"},
  cord:      {nm:"MONTAÑAS",        ic:"⛰️", c1:"#a07a44", c2:"#5f441f"},
  costas:    {nm:"CIUDADES Y MARES", ic:"🏙️", c1:"#2e9e5b", c2:"#165b31"}
};
var NIVELES = ["", "Primeros pasos", "Fácil", "Normal", "Difícil", "Experto"];
var MAXLV = 5;

/* ---------------- estado ---------------- */
var KEY = "geo_nil_v1";
var S;
function estadoNuevo(){
  return {
    v:2, monedas:0, cromos:{}, racha:0, ultimoDia:"",
    eco:{acierto:10, sobre:200, cromo:500},
    nivel:{ccaa:1, capitales:1, rios:1, cord:1, costas:1},
    activo:{ccaa:true, capitales:true, rios:true, cord:true, costas:true},
    stats:{}, sesiones:0
  };
}
/* De 3 niveles a 5: el salto fácil->normal metía de golpe media España.
   Lo guardado con la escala vieja se estira (1,2,3 -> 1,3,5) para no
   castigar a quien ya jugaba en difícil. */
function migrar(){
  if(S.v >= 2) return;
  var mapa3a5 = {1:1, 2:3, 3:5};
  for(var b in S.nivel) S.nivel[b] = mapa3a5[S.nivel[b]] || S.nivel[b];
  if(!("capitales" in S.nivel)) S.nivel.capitales = S.nivel.ccaa;
  if(!("capitales" in S.activo)) S.activo.capitales = true;
  if(S.eco && !S.eco.cromo) S.eco.cromo = 500;
  S.v = 2;
}
function completar(){
  var base = estadoNuevo();
  for(var k in base){ if(!(k in S)) S[k] = base[k]; }
  for(var e in base.eco){ if(!(e in S.eco)) S.eco[e] = base.eco[e]; }
  for(var b in BLOQUES){
    if(!(b in S.nivel)) S.nivel[b] = 1;
    if(!(b in S.activo)) S.activo[b] = true;
    if(S.nivel[b] > MAXLV) S.nivel[b] = MAXLV;
  }
}
function cargar(){
  try{ S = JSON.parse(localStorage.getItem(KEY)) || estadoNuevo(); }
  catch(e){ S = estadoNuevo(); }
  completar(); migrar();
}
function guardar(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function hoy(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function tocaDia(){
  var h=hoy();
  if(S.ultimoDia===h) return;
  var ayer=new Date(); ayer.setDate(ayer.getDate()-1);
  var a=ayer.getFullYear()+"-"+String(ayer.getMonth()+1).padStart(2,"0")+"-"+String(ayer.getDate()).padStart(2,"0");
  S.racha = (S.ultimoDia===a) ? S.racha+1 : 1;
  S.ultimoDia=h; guardar();
}
function multRacha(){ return S.racha>=3 ? 1.5 : 1; }

/* ---------------- utilidades ---------------- */
function go(id){
  var all=document.querySelectorAll(".scr");
  for(var i=0;i<all.length;i++) all[i].classList.remove("on");
  document.getElementById(id).classList.add("on");
  window.scrollTo(0,0);
}
/* Volver a la portada SIEMPRE repintando: si no, el contador de monedas y el
   botón del sobre se quedan con el valor de la última vez que se pintó (arranque),
   y por mucho que Nil gane monedas el sobre sigue desactivado. */
function irHome(){ go("home"); pintarHome(); }
function baraja(a){
  a=a.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function el(tag,cls,txt){
  var e=document.createElement(tag);
  if(cls) e.className=cls;
  if(txt!=null) e.textContent=txt;
  return e;
}
function caso(txt, bloque){
  /* MAYÚSCULAS hasta Normal, minúscula en Difícil y Experto: leer en minúscula
     es más difícil y se premia igual que en LEER_ESCRIBIR. */
  return S.nivel[bloque] >= 4 ? txt : txt.toUpperCase();
}

/* ---------------- banderas de las comunidades ----------------
   Se usan como pista al preguntar y como premio al acertar. Nunca se pregunta
   por ellas: el juego sigue siendo tocar el mapa. */
var CCAA_POR_NOMBRE = {};
for(var _i=0;_i<MAPA.ccaa.length;_i++) CCAA_POR_NOMBRE[MAPA.ccaa[_i].n] = MAPA.ccaa[_i].id;
function bandera(idccaa, cls){
  var d = BANDERAS[idccaa];
  if(!d) return null;
  var s = document.createElementNS("http://www.w3.org/2000/svg","svg");
  s.setAttribute("viewBox","0 0 60 40");
  s.setAttribute("class", cls || "bandera");
  s.innerHTML = d;
  return s;
}
function banderaDe(it){
  if(it.tipo === "ccaa") return it.ref.id;
  if(it.tipo === "capital") return CCAA_POR_NOMBRE[it.ref.ccaaNom] || null;
  return null;
}

/* ---------------- catálogo de preguntas ---------------- */
function itemsDe(bloque){
  var lv = S.nivel[bloque], out = [];
  function add(arr, tipo){
    for(var i=0;i<arr.length;i++){
      var x=arr[i];
      if(x.lv<=lv) out.push({tipo:tipo, ref:x, id:tipo+":"+x.id, n:x.n, art:x.art||""});
    }
  }
  if(bloque==="ccaa") add(MAPA.ccaa,"ccaa");
  if(bloque==="capitales"){
    for(var i=0;i<MAPA.ciudades.length;i++){
      var c=MAPA.ciudades[i];
      if(c.cap && c.lv<=lv) out.push({tipo:"capital", ref:c, id:"cap:"+c.id, n:c.n, art:"", ccaa:c.ccaaNom});
    }
  }
  if(bloque==="rios") add(MAPA.rios,"rio");
  if(bloque==="cord") add(MAPA.cord,"cord");
  if(bloque==="costas"){
    /* las capitales ya tienen bloque propio: aquí solo las demás ciudades */
    for(var i=0;i<MAPA.ciudades.length;i++){
      var c2=MAPA.ciudades[i];
      if(!c2.cap && c2.lv<=lv) out.push({tipo:"ciudad", ref:c2, id:"ciudad:"+c2.id, n:c2.n, art:""});
    }
    add(MAPA.aguas,"agua");
  }
  return out;
}
