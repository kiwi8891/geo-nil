<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1b2e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>GEO NIL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1b2e; --navy2:#152942; --cream:#f6efdd; --paper:#fbf6e9;
  --gold:#f0c24b; --gold2:#b8862a; --red:#c0392b; --green:#2e9e5b;
  --tierra:#b9a87e; --agua:#2f7fc4; --monte:#a98b5e;
  --sombra:0 6px 0 rgba(0,0,0,.28);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{
  font-family:Andika,system-ui,sans-serif; color:var(--cream);
  background:var(--navy);
  background-image:radial-gradient(circle at 20% 0%,#1d3a5c 0%,transparent 55%),
                   radial-gradient(circle at 85% 100%,#1a3350 0%,transparent 50%);
  background-attachment:fixed;
  padding-top:var(--safe-t); padding-bottom:var(--safe-b);
  user-select:none; -webkit-user-select:none;
}
.scr{display:none; min-height:100dvh; flex-direction:column}
.scr.on{display:flex; animation:entraScr .26s ease-out both}
@keyframes entraScr{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}
@media(prefers-reduced-motion:reduce){
  .scr.on,.premio,.revel>div.va,.lupaCromo{animation-duration:.01ms !important}
}
h1,h2,h3,.anton{font-family:Anton,Impact,sans-serif; font-weight:400; letter-spacing:.02em}

/* ---------- chrome ---------- */
.top{display:flex; align-items:center; gap:10px; padding:10px 14px; flex:0 0 auto}
.top .sp{flex:1}
.chip{
  display:inline-flex; align-items:center; gap:7px; padding:7px 13px; border-radius:99px;
  background:linear-gradient(180deg,#23405f,#16283f); border:2px solid rgba(240,194,75,.45);
  font-weight:700; font-size:17px; font-variant-numeric:tabular-nums; white-space:nowrap;
}
.chip b{color:var(--gold); display:inline-block}
.chip b.sube{animation:sube .42s cubic-bezier(.2,1.5,.4,1)}
@keyframes sube{0%{transform:scale(1)}40%{transform:scale(1.35); color:#fff}100%{transform:scale(1)}}
.btn{
  font-family:Anton,Impact,sans-serif; font-size:19px; letter-spacing:.03em; color:var(--navy);
  background:linear-gradient(180deg,#ffd76b,var(--gold) 55%,var(--gold2));
  border:none; border-radius:14px; padding:13px 22px; box-shadow:var(--sombra); cursor:pointer;
}
.btn:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.28)}
.btn.sec{background:linear-gradient(180deg,#3a5f87,#233f5e); color:var(--cream)}
.btn.sm{font-size:15px; padding:9px 15px; border-radius:11px; box-shadow:0 4px 0 rgba(0,0,0,.28)}
.btn[disabled]{filter:grayscale(.75) brightness(.7); pointer-events:none}

/* ---------- portada ---------- */
/* el contenido va centrado, pero la barra de monedas se queda arriba:
   centrar la pantalla entera se la llevaba al medio */
#home{justify-content:center; position:relative}
#home .top{position:absolute; top:0; left:0; right:0}
#home .bloques{margin-top:8px}
.cover{text-align:center; padding:6px 20px 4px}
.cover h1{
  font-size:clamp(46px,11vw,84px); margin:0; line-height:.92;
  background:linear-gradient(180deg,#fff3c9,var(--gold) 45%,#8a6318);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.35));
}
.cover p{margin:4px 0 0; opacity:.62; font-size:15px; letter-spacing:.14em; text-transform:uppercase}
.bloques{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(152px,1fr)); gap:13px;
  padding:16px; max-width:1000px; margin:0 auto; width:100%;
}
.bq{
  position:relative; border:none; border-radius:18px; padding:18px 14px 15px; cursor:pointer;
  background:linear-gradient(160deg,var(--c1),var(--c2)); color:#fff; box-shadow:var(--sombra);
  display:flex; flex-direction:column; align-items:center; gap:7px; overflow:hidden;
}
.bq:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.28)}
.bq::after{content:""; position:absolute; inset:0;
  background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.22) 50%,transparent 58%)}
.bq .ic{font-size:36px; line-height:1}
.bq .nm{font-family:Anton,Impact,sans-serif; font-size:19px; letter-spacing:.03em; text-align:center}
.bq .lv{font-size:12px; opacity:.85; letter-spacing:.1em; text-transform:uppercase}
.bq.off{filter:grayscale(.85) brightness(.55); pointer-events:none}
.fila{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; padding:4px 16px 20px}

/* ---------- juego ---------- */
#juego{height:100dvh}
.preg{
  flex:0 0 auto; margin:2px 14px 8px; padding:11px 18px; border-radius:15px; text-align:center;
  background:linear-gradient(180deg,var(--paper),#efe5cc); color:#2b2317;
  border:3px solid var(--gold2); box-shadow:var(--sombra); position:relative;
}
.pregfila{display:flex; align-items:center; gap:13px; justify-content:center}
.pregfila .txt{min-width:0}
.bandwrap:empty{display:none}
.bandera{width:54px; border-radius:4px; border:2px solid rgba(0,0,0,.25); display:block;
  box-shadow:0 2px 4px rgba(0,0,0,.25)}
.bandera.mini{width:44px; flex:0 0 auto}
.preg .q{font-size:clamp(19px,4.2vw,27px); font-weight:700; line-height:1.15}
.preg .q em{font-style:normal; color:#8a2c1f}
.preg .sub{font-size:13px; opacity:.6; margin-top:2px}
.mapwrap{flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; padding:0 10px 10px}
svg.mapa{overflow:hidden; width:100%; height:100%; max-height:100%; display:block; touch-action:manipulation}
svg.mapa .hit{cursor:pointer}
.barra{display:flex; gap:5px; justify-content:center; padding:0 14px 8px; flex:0 0 auto}
.pip{width:26px; height:8px; border-radius:99px; background:rgba(255,255,255,.18)}
.pip.ok{background:var(--green)} .pip.ko{background:var(--red)} .pip.now{background:var(--gold)}

/* premio al acertar una comunidad o su capital */
.premio{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:5;
  pointer-events:none; text-align:center; animation:premioIn .5s cubic-bezier(.2,1.4,.4,1) both,
  premioOut .45s ease-in 1.05s both}
.premio .bandera{width:min(34vw,190px); border-width:4px; border-radius:7px;
  box-shadow:0 12px 34px rgba(0,0,0,.6)}
.premio .nm{margin-top:8px; font-family:Anton,Impact,sans-serif; font-size:23px; color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,.85), 0 0 3px rgba(0,0,0,.9)}
@keyframes premioIn{from{opacity:0; transform:translate(-50%,-50%) scale(.4) rotate(-7deg)}
  to{opacity:1; transform:translate(-50%,-50%) scale(1)}}
@keyframes premioOut{to{opacity:0; transform:translate(-50%,-58%) scale(.92)}}
.mapwrap{position:relative}

/* animaciones de respuesta */
@keyframes pulso{0%,100%{opacity:1}50%{opacity:.35}}
.flash-ok{animation:pulso .45s ease-in-out 2}
@keyframes tiembla{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.tiembla{animation:tiembla .32s ease-in-out 2}

/* ---------- fin de ronda ---------- */
.panel{
  background:linear-gradient(180deg,var(--paper),#ece0c4); color:#2b2317; border:3px solid var(--gold2);
  border-radius:20px; padding:22px; box-shadow:var(--sombra); max-width:480px; margin:auto; text-align:center;
}
.panel h2{font-size:34px; margin:0 0 6px; color:#1d3350}
.caritas{font-size:58px; margin:6px 0}
.ganado{font-size:22px; font-weight:700; font-variant-numeric:tabular-nums}
.ganado b{color:#9a6c10}
#fSobre.listo{color:#1b6b3a; opacity:1; font-weight:700}

/* ---------- cromo ---------- */
.cromo{
  position:relative; width:100%; aspect-ratio:3/4.3; border-radius:12px; overflow:hidden;
  background:linear-gradient(165deg,var(--t1,#24405e),var(--t2,#101f33));
  border:3px solid var(--gold2); box-shadow:0 4px 0 rgba(0,0,0,.3); display:flex; flex-direction:column;
}
.cromo::before{content:""; position:absolute; inset:0; z-index:3; pointer-events:none;
  background:linear-gradient(118deg,transparent 40%,rgba(255,255,255,.3) 48%,transparent 56%)}
.cromo .foto{flex:1 1 auto; min-height:0; position:relative; display:flex; align-items:flex-end; justify-content:center}
.cromo .foto img{width:100%; height:100%; object-fit:contain; object-position:bottom; filter:drop-shadow(0 3px 5px rgba(0,0,0,.45))}
.cromo .escudo{position:absolute; top:5px; left:5px; width:24%; max-width:38px; z-index:2; filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.cromo .dorsal{position:absolute; top:4px; right:6px; z-index:2; font-family:Anton,Impact,sans-serif;
  font-size:clamp(17px,5.5cqw,26px); color:rgba(255,255,255,.92); text-shadow:0 2px 3px rgba(0,0,0,.6)}
.cromo .placa{flex:0 0 auto; background:linear-gradient(180deg,var(--gold),#a5761f); color:#1a1205;
  padding:4px 6px 5px; text-align:center; z-index:2}
.cromo .placa .n{font-family:Anton,Impact,sans-serif; font-size:clamp(11px,3.4cqw,15px); line-height:1.05;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cromo .placa .p{font-size:clamp(8px,2.6cqw,11px); opacity:.72; text-transform:uppercase; letter-spacing:.06em}
.cromo.vacio{background:repeating-linear-gradient(45deg,#1a2c44,#1a2c44 7px,#16263b 7px,#16263b 14px);
  border-color:#31486a; border-style:dashed; align-items:center; justify-content:center}
.cromo.vacio span{font-size:30px; opacity:.28}
.cromo.nuevo{border-color:#fff3c9; box-shadow:0 0 0 3px var(--gold),0 4px 16px rgba(240,194,75,.55)}
.cromo.est .foto{align-items:center}
.cromo.est .foto{position:relative}
.cromo.est .estadio-ic{font-size:clamp(40px,46cqw,120px); filter:drop-shadow(0 4px 10px rgba(0,0,0,.55)); z-index:1}
.cromo.est .foto::before{content:""; position:absolute; inset:14% 12%; opacity:.16;
  background:radial-gradient(circle at 50% 55%,#fff 0%,transparent 68%)}
.cromo.est .placa{background:linear-gradient(180deg,#cfe4f2,#8fb4cd)}
.cromo.est .placa .n{white-space:normal; font-size:clamp(9px,2.9cqw,13px); line-height:1.1}
.cromo.comprable{cursor:pointer; border-style:dashed; opacity:.92}
.cromo.comprable:active{transform:translateY(2px)}

/* ---------- álbum ---------- */
.scroll{flex:1 1 auto; align-self:stretch; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 14px 24px}
.equipos{display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:12px; max-width:900px; margin:0 auto}
.eqc{background:linear-gradient(170deg,#23405f,#14263c); border:2px solid #31486a; border-radius:15px;
  padding:12px 9px 10px; text-align:center; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.26)}
.eqc:active{transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.26)}
.eqc img{width:52px; height:52px; object-fit:contain}
.eqc .nm{font-family:Anton,Impact,sans-serif; font-size:14px; margin-top:6px; line-height:1.1}
.eqc .pr{font-size:12px; opacity:.72; font-variant-numeric:tabular-nums; margin-top:3px}
.eqc.full{border-color:var(--gold); box-shadow:0 0 0 2px rgba(240,194,75,.35),0 4px 0 rgba(0,0,0,.26)}
.eqc .barr{height:5px; border-radius:99px; background:rgba(0,0,0,.35); margin-top:7px; overflow:hidden}
.eqc .barr .in{height:100%; background:linear-gradient(90deg,var(--gold),#ffe6a1); border-radius:99px;
  transition:width .3s}
.cromos{display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:11px; max-width:900px; margin:0 auto}
.cromos>div{container-type:inline-size}

/* ---------- sobre ---------- */
#sobre{justify-content:center}
.sobrewrap{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px}
.sobrewrap>*{width:100%; max-width:680px}
#sZona{align-self:center}
#sZona{display:flex; flex-direction:column; align-items:center; gap:14px}
.paquete{width:min(62vw,270px); aspect-ratio:3/4.1; border-radius:16px; cursor:pointer; position:relative;
  background:linear-gradient(150deg,#e0453a,#a8171c 45%,#6d0d12);
  border:3px solid var(--gold2); box-shadow:0 10px 26px rgba(0,0,0,.5); overflow:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px}
.paquete::after{content:""; position:absolute; inset:0;
  background:linear-gradient(112deg,transparent 38%,rgba(255,255,255,.35) 47%,transparent 56%)}
.paquete .t{font-family:Anton,Impact,sans-serif; font-size:30px; color:var(--gold); text-shadow:0 2px 4px rgba(0,0,0,.5)}
.paquete .s{font-size:13px; opacity:.85; letter-spacing:.14em; text-transform:uppercase}
.paquete .b{font-size:52px}
@keyframes abre{0%{transform:scale(1) rotate(0)}45%{transform:scale(1.07) rotate(-2.5deg)}
  100%{transform:scale(.35) rotate(9deg); opacity:0}}
.paquete.abriendo{animation:abre .6s ease-in forwards}
.revel{display:grid; gap:12px; width:100%; padding:0 6px;
  grid-template-columns:repeat(5,1fr)}
.revel>div{container-type:inline-size; opacity:0; transform:translateY(24px) scale(.85)}
@keyframes entra{to{opacity:1; transform:none}}
.revel>div.va{animation:entra .42s cubic-bezier(.2,1.3,.4,1) forwards}
.revel .tag{position:absolute; bottom:22%; left:50%; transform:translateX(-50%); z-index:4;
  background:var(--green); color:#fff; font-family:Anton,Impact,sans-serif; font-size:10px;
  padding:2px 7px; border-radius:99px; letter-spacing:.06em}
.revel .tag.rep{background:#6b7b8c}
@media(max-width:560px){.revel{grid-template-columns:repeat(3,1fr)}}

/* ---------- panel de papá ---------- */
.pp{max-width:560px; margin:0 auto; width:100%}
.pp .fila2{display:flex; align-items:center; gap:10px; padding:11px 13px; margin-bottom:9px;
  background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:13px}
.pp .fila2 .nm{flex:1; font-family:Anton,Impact,sans-serif; font-size:16px}
.seg{display:flex; gap:4px; background:rgba(0,0,0,.28); padding:3px; border-radius:10px}
.seg button{border:none; background:transparent; color:var(--cream); font-family:Anton,Impact,sans-serif;
  font-size:13px; padding:6px 11px; border-radius:8px; cursor:pointer; opacity:.5}
.seg button.on{background:var(--gold); color:var(--navy); opacity:1}
.sw{width:50px; height:29px; border-radius:99px; background:rgba(0,0,0,.35); position:relative; cursor:pointer; flex:0 0 auto}
.sw::after{content:""; position:absolute; top:3px; left:3px; width:23px; height:23px; border-radius:50%;
  background:#8296ab; transition:.18s}
.sw.on{background:rgba(46,158,91,.4)} .sw.on::after{left:24px; background:var(--green)}
.gear{background:none; border:none; font-size:21px; opacity:.32; cursor:pointer; padding:5px}
.mini{font-size:13px; opacity:.6; line-height:1.5}
.tt{font-family:Anton,Impact,sans-serif; font-size:13px; letter-spacing:.12em; text-transform:uppercase;
  opacity:.5; margin:16px 0 8px}
textarea.ta{width:100%; min-height:96px; background:rgba(0,0,0,.34); color:var(--cream);
  border:1px solid rgba(255,255,255,.2); border-radius:11px; padding:10px 12px; font-size:12px;
  font-family:ui-monospace,Menlo,monospace; resize:vertical; margin-top:9px; -webkit-user-select:text;
  user-select:text; word-break:break-all}
.aviso{font-size:13px; margin-top:8px; padding:9px 12px; border-radius:10px; line-height:1.45}
.aviso.ok{background:rgba(46,158,91,.18); border:1px solid rgba(46,158,91,.5)}
.aviso.ko{background:rgba(192,57,43,.18); border:1px solid rgba(192,57,43,.5)}
input.num{background:rgba(0,0,0,.3); border:1px solid rgba(255,255,255,.2); color:var(--cream);
  border-radius:9px; padding:9px 11px; font-size:17px; width:110px; font-family:Andika,sans-serif}

/* ---------- tienda ---------- */
.tit{font-family:Anton,Impact,sans-serif; font-size:27px; text-align:center; margin:4px 0 6px;
  letter-spacing:.04em; color:var(--gold)}
.tiendawrap{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px}
.tiendawrap .mini{text-align:center}
.opciones{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:16px;
  width:100%; max-width:640px; margin:8px auto}
.op{border-radius:20px; padding:20px 16px 17px; text-align:center; cursor:pointer;
  background:linear-gradient(165deg,#2a4c70,#152a42); border:3px solid var(--gold2);
  box-shadow:var(--sombra); display:flex; flex-direction:column; gap:7px; position:relative; overflow:hidden}
.op::after{content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.16) 50%,transparent 58%)}
.op:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.28)}
.op .ic{font-size:44px; line-height:1}
.op .nm{font-family:Anton,Impact,sans-serif; font-size:21px; color:var(--gold)}
.op .de{font-size:13px; opacity:.72; line-height:1.4}
.op .precio{margin-top:5px; font-family:Anton,Impact,sans-serif; font-size:20px;
  background:rgba(0,0,0,.3); border-radius:99px; padding:5px 12px; align-self:center;
  font-variant-numeric:tabular-nums}
.op.no{filter:grayscale(.8) brightness(.62); pointer-events:none}

/* ---------- cromo a pantalla completa ---------- */
#lupa{position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
  flex-direction:column; gap:14px; padding:20px; background:rgba(6,12,22,.9);
  backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px)}
#lupa.on{display:flex}
#lupaCaja{display:flex; gap:20px; align-items:center; justify-content:center; flex-wrap:wrap;
  max-width:760px; width:100%}
.lupaCromo{container-type:inline-size; width:min(62vw,250px); animation:lupaIn .3s cubic-bezier(.2,1.3,.4,1) both}
@keyframes lupaIn{from{opacity:0; transform:scale(.8)}to{opacity:1; transform:none}}
.ficha{background:linear-gradient(180deg,var(--paper),#ece0c4); color:#2b2317; border:3px solid var(--gold2);
  border-radius:16px; padding:16px 18px; min-width:min(100%,250px); box-shadow:var(--sombra)}
.ficha h3{font-family:Anton,Impact,sans-serif; font-size:23px; margin:0 0 10px; color:#1d3350; line-height:1.1}
.ficha .d{display:flex; gap:10px; padding:5px 0; border-top:1px solid rgba(0,0,0,.12); font-size:15px}
.ficha .d .k{opacity:.6; min-width:74px}
.ficha .d .v{font-weight:700}
#lupa .cerrar{font-size:13px; opacity:.55}

/* ---------- panel: fila de bloque con nivel ---------- */
.pp .fila2.bl{align-items:center}
.pp .fila2 .col{flex:1; display:flex; flex-direction:column; gap:2px; min-width:0}
.pp .fila2 .col .nm{font-family:Anton,Impact,sans-serif; font-size:16px}
.pp .fila2 .col .lvnm{font-size:12px; opacity:.58}
.seg button{padding:6px 9px; min-width:30px}
.revel.uno{grid-template-columns:minmax(0,220px); justify-content:center}

/* ---------- aprender ---------- */
#aprende{height:100dvh}
.pestanas{display:flex; gap:6px; flex:1; flex-wrap:wrap; justify-content:flex-end}
.pes{border:2px solid rgba(240,194,75,.35); background:linear-gradient(180deg,#23405f,#16283f);
  color:var(--cream); font-family:Anton,Impact,sans-serif; font-size:13px; letter-spacing:.03em;
  padding:8px 12px; border-radius:99px; cursor:pointer; opacity:.62; white-space:nowrap}
.pes.on{opacity:1; background:linear-gradient(180deg,#ffd76b,var(--gold) 60%,var(--gold2));
  color:var(--navy); border-color:var(--gold)}
.apcuerpo{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; padding:0 12px 10px; gap:8px}
#apMapa{flex:1 1 auto; min-height:0}
.aplista{flex:0 0 auto; display:flex; gap:6px; flex-wrap:wrap; justify-content:center;
  max-height:22vh; overflow-y:auto; padding:2px}
.chipn{border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.07); color:var(--cream);
  font-family:Andika,sans-serif; font-size:13px; padding:5px 11px; border-radius:99px; cursor:pointer}
.chipn.conficha{border-color:rgba(240,194,75,.6); background:rgba(240,194,75,.14)}
.chipn:active{transform:translateY(1px)}

/* ---------- ficha de un sitio ---------- */
#ficha{position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center;
  padding:16px; background:rgba(6,12,22,.9); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px)}
#ficha.on{display:flex}
.fichacaja{background:linear-gradient(180deg,var(--paper),#ece0c4); color:#2b2317;
  border:3px solid var(--gold2); border-radius:20px; width:min(100%,820px); max-height:92dvh;
  overflow-y:auto; -webkit-overflow-scrolling:touch; box-shadow:0 18px 50px rgba(0,0,0,.6);
  animation:lupaIn .28s cubic-bezier(.2,1.3,.4,1) both}
.fcab{display:flex; align-items:center; gap:14px; padding:16px 18px 12px; position:sticky; top:0;
  background:linear-gradient(180deg,var(--paper) 78%,transparent); z-index:2}
.fcab .bandera{width:74px; flex:0 0 auto}
.ftit{flex:1; min-width:0}
.ftit h2{font-family:Anton,Impact,sans-serif; font-size:clamp(25px,5vw,36px); margin:0; color:#1d3350;
  line-height:1.05}
.fsub{font-size:14px; opacity:.62; margin-top:2px}
.fcerrar{border:none; background:rgba(0,0,0,.1); color:#2b2317; font-size:19px; width:38px; height:38px;
  border-radius:50%; cursor:pointer; flex:0 0 auto}
.fcuerpo{padding:0 18px 20px}
.ffotos{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; margin-bottom:14px}
.ffotos figure{margin:0}
.ffotos img{width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:12px; display:block;
  border:2px solid rgba(0,0,0,.18); background:#d9d2bd}
.ffotos figcaption{font-size:9px; opacity:.45; margin-top:3px; line-height:1.25;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.fmini{float:right; width:min(38%,240px); margin:0 0 10px 14px}
.fmini svg{width:100%; border-radius:10px; border:2px solid rgba(0,0,0,.18); display:block}
.fmini .pie{font-size:11px; opacity:.5; text-align:center; margin-top:3px}
.ftexto{font-size:clamp(16px,2.2vw,19px); line-height:1.6; margin:0 0 12px}
.ftexto.pend{opacity:.55; font-style:italic}
.fdato{clear:both; background:rgba(46,158,91,.14); border:2px solid rgba(46,158,91,.45);
  border-radius:14px; padding:12px 14px; font-size:16px; line-height:1.5}
.fdato .et{display:block; font-family:Anton,Impact,sans-serif; font-size:13px; letter-spacing:.08em;
  color:#1b6b3a; margin-bottom:3px}
@media(max-width:560px){ .fmini{float:none; width:100%; margin:0 0 12px} }
</style>
